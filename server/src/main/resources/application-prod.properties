# ============================================
# PRODUCTION CONFIGURATION (Render or Supabase)
# ============================================

# -------- DATABASE CONFIGURATION --------
# Accepts Render's variables or standard Spring variables, which take priority.
# Supabase: use the Session pooler (port 5432, IPv4) with ?sslmode=require.
# Example: jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Small pool: Supabase's shared session pooler has a limited number of clients.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=1800000

# Spring DB creation on init
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# JPA/HIBERNATE SETTINGS
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true

# -------- SERVER SECURITY --------
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.timeout=30m

# -------- EMAIL CONFIGURATION (Brevo API REST - NO SMTP) --------
# Secrets are provided by Render. Empty defaults keep the app bootable.
brevo.api.key=${BREVO_API_KEY:}
app.email.sender=${MAIL_FROM:}
app.email.sender-name=${MAIL_FROM_NAME:Secret Santa Organizer}

# -------- SECURITY & MONITORING --------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.metrics.export.statsd.enabled=false

# -------- LOGGING --------
logging.level.com.kdmm.secretsanta=INFO
logging.level.com.kdmm.secretsanta.service.EmailService=DEBUG
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=ERROR
logging.pattern.console=%d{dd-MM-yyyy HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# -------- ASYNC CONFIGURATION --------
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100