# ========================
# APPLICATION METADATA
# ========================
spring.application.name=Secret Santa Organizer

# ========================
# DATABASE (PostgreSQL)
# ========================
spring.datasource.url=jdbc:postgresql://localhost:5432/secretsanta
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================
# EMAIL CONFIGURATION (Brevo HTTP API)
# ========================
# Values come from environment variables / secrets. No addresses are committed.
spring.mail.host=${SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from.address=${MAIL_FROM:}

# ========================
# EMAIL SAFETY
# ========================
# No default address on purpose: configure MAIL_FROM as a secret in Render.
app.email.sender=${MAIL_FROM:}
app.email.sender-name=${MAIL_FROM_NAME:Secret Santa Organizer}

# ========================
# ANTI-ABUSE RATE LIMITS
# ========================
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.create-games-per-hour=${RATE_LIMIT_CREATE_GAMES:5}
app.rate-limit.join-per-minute=${RATE_LIMIT_JOIN:10}
app.rate-limit.assign-per-minute=${RATE_LIMIT_ASSIGN:3}

# ========================
# ASYNC & THREADS
# ========================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# ========================
# HEALTH ENDPOINT
# ========================
# Used by uptime monitors and keep-alive jobs. /actuator/health/liveness
# only reports the process state and never touches the database.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ========================
# SERVER
# ========================
server.port=8080
server.error.include-stacktrace=never

# ========================
# LOGGING
# ========================
logging.level.com.kdmm.secretsanta=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
