# ========================
# TEST CONFIGURATION (H2 in-memory, no PostgreSQL needed)
# ========================
spring.datasource.url=jdbc:h2:mem:secretsanta;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# All controllers return DTOs; no lazy loading during view rendering.
spring.jpa.open-in-view=false

# Tables are created by Hibernate; do not run the PostgreSQL schema.sql.
spring.sql.init.mode=never

# Dummy mail settings so the context can start without real credentials.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.email.sender=
app.email.sender-name=Secret Santa Test
app.rate-limit.enabled=false

# Health endpoint configuration (mirrors src/main/resources).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoints.web.cors.allowed-origin-patterns=https://secret-santa-organizer*.vercel.app,https://*.vercel.app,http://localhost:*
management.endpoints.web.cors.allowed-methods=GET,OPTIONS

brevo.api.key=
logging.level.com.kdmm.secretsanta=WARN
