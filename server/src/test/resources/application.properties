# ========================
# TEST CONFIGURATION (H2 in-memory, no PostgreSQL needed)
# ========================
spring.datasource.url=jdbc:h2:mem:secretsanta;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Tables are created by Hibernate; do not run the PostgreSQL schema.sql.
spring.sql.init.mode=never

# Dummy mail settings so the context can start without real credentials.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.email.sender=
app.email.sender-name=Secret Santa Test
app.rate-limit.enabled=false

brevo.api.key=
logging.level.com.kdmm.secretsanta=WARN
